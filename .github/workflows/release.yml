name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    # Job level, not step level, and this is the whole point: a step's `if` is evaluated before that
    # step's own `env:` block exists, so `if: env.VSCE_PAT != ''` on a step that defines VSCE_PAT
    # itself is always false. Set here, both the gate and the publish see it.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Package
        run: npx --yes @vscode/vsce@3 package --no-dependencies --out prompt-forge-trifactor-${GITHUB_REF_NAME#v}.vsix
      - name: GitHub Release with the vsix
        uses: softprops/action-gh-release@v2
        with:
          files: prompt-forge-trifactor-*.vsix
          generate_release_notes: true
      - name: Publish to the VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce@3 publish --skip-duplicate --packagePath prompt-forge-trifactor-*.vsix
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish prompt-forge-trifactor-*.vsix -p "$OVSX_PAT"
